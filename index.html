<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0c">
<meta name="description" content="Расписание занятий группы 3102 — экономическое право.">
<title>Расписание 3102 — Экономическое право</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060807;--panel:#0d1210;--panel2:#111714;--text:#f2f3ef;--muted:#a1aaa3;
  --muted2:#707a73;--accent:#c6a15a;--accent2:#e3c77e;--line:rgba(255,255,255,.09);
  --shadow:0 24px 80px rgba(0,0,0,.5)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  background:
    radial-gradient(900px 500px at 80% -10%,rgba(198,161,90,.12),transparent 65%),
    linear-gradient(180deg,#050706 0%,#080b09 48%,#050706 100%);
  font-family:"El Messiri",Georgia,"Times New Roman",serif;
  font-weight:400;
  -webkit-font-smoothing:antialiased
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 75%)
}
button{font:inherit;color:inherit}
.app{width:min(1080px,100%);margin:0 auto;padding:14px 14px 42px;position:relative}

/* HERO */
.hero{
  position:relative;min-height:390px;overflow:hidden;border:1px solid var(--line);
  border-radius:30px;box-shadow:var(--shadow);background:#090c0b
}
.hero-photo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;
  opacity:.62;filter:saturate(.65) contrast(1.05) brightness(.92)
}
.hero-overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(4,6,5,.92) 0%,rgba(4,6,5,.72) 32%,rgba(4,6,5,.35) 68%,rgba(4,6,5,.55) 100%),
    linear-gradient(180deg,rgba(4,6,5,.12) 0%,rgba(4,6,5,.28) 45%,rgba(4,6,5,.88) 100%)
}
.hero-glow{
  position:absolute;width:360px;height:360px;right:-130px;top:-160px;border-radius:50%;
  background:rgba(198,161,90,.13);filter:blur(2px)
}
.hero-content{position:relative;z-index:2;min-height:400px;padding:8px 34px 28px;display:flex;flex-direction:column;justify-content:space-between}
.hero-text{min-width:0}
.hero-main{display:flex;align-items:center;gap:20px;max-width:780px}
.emblem{
  width:108px;height:108px;object-fit:contain;flex:0 0 auto;padding:2px;
  border-radius:0;background:transparent;
  border:none;box-shadow:none;filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))
}
.eyebrow{font-size:5px;letter-spacing:.45em;color:var(--accent2);font-weight:500;text-transform:uppercase;margin:0 0 4px}
.hero-title{font-size:clamp(7px,1.3vw,8px);letter-spacing:.45em;margin:0;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.5)}
h1{font-size:clamp(30px,5.2vw,50px);line-height:1.05;margin:0;font-weight:500;letter-spacing:-.015em;text-shadow:0 5px 25px rgba(0,0,0,.45)}
.subtitle{margin:12px 0 0;color:#c5cbc5;font-size:14px;letter-spacing:.06em;font-weight:400;opacity:.92}
.motto{
  max-width:520px;margin:16px 0 0;padding-left:14px;border-left:2px solid var(--accent);
  font-family:"El Messiri",Georgia,"Times New Roman",serif;font-size:15px;font-weight:400;line-height:1.4;color:#e8d9b0;
  text-shadow:0 3px 14px rgba(0,0,0,.6);letter-spacing:.03em;opacity:.92
}
.hero-bottom{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.badge{
  display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;
  background:rgba(198,161,90,.14);border:1px solid rgba(227,199,126,.35);
  color:var(--accent2);font-size:12px;font-weight:500;letter-spacing:.1em;backdrop-filter:blur(8px)
}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 15px rgba(227,199,126,.8)}
.today-label{color:#d0d5d1;font-size:12px;text-shadow:0 2px 10px #000}

/* DATES */
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 10px}
.section-title{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.today-btn{
  border:1px solid var(--line);background:rgba(13,18,16,.75);padding:8px 14px;border-radius:999px;
  cursor:pointer;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;
  transition:border-color .18s,color .18s,background .18s
}
.today-btn:hover{border-color:rgba(198,161,90,.45);color:var(--accent2);background:rgba(198,161,90,.08)}
.date-scroller{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:none}
.date-scroller::-webkit-scrollbar{display:none}
.date-btn{
  min-width:72px;border:1px solid transparent;background:rgba(17,22,20,.55);border-radius:14px;
  padding:12px 10px;text-align:center;cursor:pointer;transition:.2s ease;flex:0 0 auto
}
.date-btn:hover{background:rgba(25,32,28,.9);border-color:rgba(255,255,255,.08)}
.date-btn .dow{display:block;font-size:10px;color:var(--muted2);font-weight:500;text-transform:uppercase;letter-spacing:.1em}
.date-btn .num{display:block;font-size:20px;font-weight:600;margin-top:4px;letter-spacing:-.02em;color:#e6e9e5}
.date-btn .mon{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.date-btn.active{
  background:rgba(198,161,90,.14);border-color:rgba(198,161,90,.5);
  box-shadow:0 0 0 1px rgba(198,161,90,.12),0 8px 24px rgba(0,0,0,.25)
}
.date-btn.active .dow{color:var(--accent2)}
.date-btn.active .num{color:#f0e6c8}
.date-btn.active .mon{color:#c9b98a}

/* SCHEDULE */
.main-grid{display:block}
.schedule-panel{
  background:rgba(13,18,16,.88);border:1px solid var(--line);border-radius:24px;
  box-shadow:0 18px 55px rgba(0,0,0,.25);padding:18px
}
.day-head{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:1px 2px 16px}
.day-name{font-size:27px;font-weight:500;letter-spacing:-.01em}
.day-date{color:var(--muted);font-size:12px;margin-top:3px}
.lesson-count{
  color:var(--accent2);font-size:11px;font-weight:500;padding:8px 10px;border:1px solid rgba(198,161,90,.25);
  background:rgba(198,161,90,.08);border-radius:11px;white-space:nowrap
}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{
  display:grid;grid-template-columns:48px minmax(0,1fr);gap:13px;padding:15px;border-radius:19px;
  background:linear-gradient(145deg,rgba(25,32,28,.98),rgba(13,18,16,.98));border:1px solid #252e29;
  transition:transform .16s,border-color .16s
}
.lesson:hover{transform:translateY(-1px);border-color:rgba(198,161,90,.28)}
.lesson-num{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#090d0b;
  border:1px solid #303a34;color:var(--accent2);
  font-family:"El Messiri",Georgia,"Times New Roman",serif;
  font-size:16px;font-weight:400;font-style:normal;letter-spacing:.02em
}
.lesson-body{min-width:0}
.time-badge{
  display:inline-flex;align-items:center;gap:7px;margin:0 0 8px;padding:6px 10px;border-radius:9px;
  background:rgba(198,161,90,.10);border:1px solid rgba(198,161,90,.22);
  color:var(--accent2);
  font-family:"El Messiri",Georgia,"Times New Roman",serif;
  font-size:13px;font-weight:400;letter-spacing:.03em
}
.time-icon{font-size:12px;opacity:.85}
.lesson-title{font-size:15px;line-height:1.45;font-weight:400;letter-spacing:.01em;color:#e8ebe7;overflow-wrap:anywhere}
.empty{padding:42px 18px;text-align:center;border:1px dashed #313a35;border-radius:18px;color:var(--muted)}
.empty strong{display:block;color:#d9ddd8;font-size:16px;margin-bottom:5px}
.footer{text-align:center;color:#59635d;font-size:10px;margin:22px 0 0;letter-spacing:.06em}

/* small visual signature */
.signature{
  margin-top:14px;border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;
  min-height:145px;background:#0a0d0c
}
.signature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;opacity:.38;filter:saturate(.65) contrast(1.1)}
.signature:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,7,.94),rgba(6,8,7,.45),rgba(6,8,7,.88))}
.signature-content{position:relative;z-index:1;padding:21px 23px}
.signature-kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);font-weight:500}
.signature-title{margin-top:5px;font-size:20px;font-weight:500}
.signature-text{margin-top:5px;font-size:12px;line-height:1.5;color:#c2c9c3;max-width:620px}

@media(max-width:620px){
  .app{padding:9px 9px 28px}
  .hero{min-height:0;border-radius:20px}
  .hero-photo{object-position:58% 25%}
  .hero-overlay{background:linear-gradient(180deg,rgba(4,6,5,.45),rgba(4,6,5,.62) 40%,rgba(4,6,5,.92) 100%)}
  .hero-content{min-height:0;padding:4px 14px 14px;gap:12px;justify-content:flex-start}
  .hero-text{min-width:0}
  .hero-main{gap:10px;align-items:center}
  .emblem{width:64px;height:64px;border-radius:0}
  .eyebrow{font-size:4px;letter-spacing:.4em;margin:0 0 2px}
  .hero-title{font-size:6px;letter-spacing:.4em}
  h1{font-size:22px;line-height:1.1}
  .subtitle{font-size:11px;margin-top:4px}
  .motto{font-size:12px;margin-top:8px;padding-left:10px;line-height:1.3}
  .hero-bottom{align-items:center;margin-top:2px}
  .badge{font-size:10px;padding:7px 11px}
  .today-label{font-size:10px}
  .schedule-panel{padding:12px;border-radius:20px}
  .day-name{font-size:23px}
  .lesson{grid-template-columns:40px minmax(0,1fr);gap:10px;padding:13px;border-radius:17px}
  .lesson-num{width:36px;height:36px;border-radius:11px}
  .lesson-title{font-size:14px}
  .signature{min-height:125px;border-radius:18px}
  .signature-content{padding:18px}
}
@media(max-width:390px){
  .hero{min-height:0}
  .hero-content{min-height:0;padding:2px 12px 12px}
  .hero-text{min-width:0}
  .hero-main{gap:8px}
  .emblem{width:56px;height:56px}
  h1{font-size:20px}
  .motto{font-size:11px;margin-top:6px}
  .hero-bottom{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}
  .date-btn{min-width:70px}
}
</style>
</head>

<main class="main-grid"><section class="schedule-panel"><div class="day-head"><div><div class="day-name" id="dayName">—</div><div class="day-date" id="dayDate">—</div></div><div class="lesson-count" id="lessonCount">0 занятий</div></div><div class="lessons" id="lessons"></div></section>

<div class="footer">ЭКОНОМИЧЕСКОЕ ПРАВО · ГРУППА 3102</div></div>
<script>
const SOURCE_URL='https://raw.githubusercontent.com/Fkm2023-oss/raspisanie-fkm-26/main/index.html';
let DATA={};
let ALL_DATES=[];
let DAY_BY_DATE={};
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DOW_FULL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTH_SHORT=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const TIME_SLOTS={1:'08:30 — 09:50',2:'10:00 — 11:20',3:'11:30 — 12:50',4:'14:20 — 15:40',5:'15:50 — 17:10',6:'17:20 — 18:40',7:'18:50 — 20:10'};let selected=null;
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtDate(s){const d=parseISO(s);return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function renderDates(){const wrap=document.getElementById('dates');wrap.innerHTML=ALL_DATES.map(s=>{const d=parseISO(s),active=s===selected;return `<button class="date-btn ${active?'active':''}" data-date="${s}"><span class="dow">${DOW[d.getDay()]}</span><span class="num">${d.getDate()}</span><span class="mon">${MONTH_SHORT[d.getMonth()]}</span></button>`}).join('');wrap.querySelectorAll('.date-btn').forEach(btn=>btn.addEventListener('click',()=>selectDate(btn.dataset.date,false)));const active=wrap.querySelector('.active');if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function renderSchedule(){const d=parseISO(selected);document.getElementById('headerDate').textContent=fmtDate(selected);document.getElementById('dayName').textContent=(DAY_BY_DATE[selected]||DOW_FULL[d.getDay()]).replace(/^./,x=>x.toUpperCase());document.getElementById('dayDate').textContent=fmtDate(selected);const items=(DATA[selected]||[]).slice().sort((a,b)=>a.lesson-b.lesson);document.getElementById('lessonCount').textContent=items.length+' '+(items.length===1?'занятие':(items.length>=2&&items.length<=4?'занятия':'занятий'));const box=document.getElementById('lessons');if(!items.length){box.innerHTML='<div class="empty"><strong>Занятий нет</strong>На выбранную дату в расписании для группы 3102 ничего не указано.</div>';return}box.innerHTML=items.map(item=>{const time=TIME_SLOTS[item.lesson]||'Время не указано';const text=String(item.text||'').replace(/\n/g,'<br>');return `<article class="lesson"><div class="lesson-num">${item.lesson}</div><div class="lesson-body"><div class="time-badge"><span class="time-icon">◷</span>${time}</div><div class="lesson-title">${escapeHtml(text).replace(/&lt;br&gt;/g,'<br>')}</div></div></article>`}).join('')}
function selectDate(s,scroll){selected=s;renderDates();renderSchedule();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function chooseInitialDate(){const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;if(ALL_DATES.includes(today))return today;const future=ALL_DATES.find(x=>x>=today);return future||ALL_DATES[0]}
document.getElementById('todayBtn').addEventListener('click',()=>{const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;selectDate(ALL_DATES.includes(today)?today:chooseInitialDate(),false)});
async function loadExactSchedule(){
  try{
    const res=await fetch(SOURCE_URL,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const html=await res.text();
    const m=html.match(/const DATA = (\{.*?\});\s*const GROUPS/s);
    if(!m) throw new Error('DATA not found');
    const source=JSON.parse(m[1]);
    const group=source['3102']||[];
    DATA={}; DAY_BY_DATE={};
    group.forEach(item=>{
      DAY_BY_DATE[item.iso]=item.day;
      DATA[item.iso]=Object.entries(item.lessons||{}).filter(([lesson,text])=>String(text||'').trim()).map(([lesson,text])=>({lesson:Number(lesson),text:String(text)}));
    });
    ALL_DATES=group.map(x=>x.iso);
    selected=chooseInitialDate();
    renderDates();renderSchedule();
    
  }catch(err){
    console.error(err);
    
    ALL_DATES=[]; DATA={}; DAY_BY_DATE={};
    renderDates();renderSchedule();
  }
}

loadExactSchedule();
</script></body></html>
